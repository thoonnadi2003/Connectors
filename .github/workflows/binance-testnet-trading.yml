name: Binance Testnet trading cycle

on:
  workflow_dispatch:
  push:
    branches:
      - codex/binance-connector-trading-tests

permissions:
  contents: read

jobs:
  trading-cycle:
    runs-on: [self-hosted, Windows, X64, stocksharp-binance]
    timeout-minutes: 10
    env:
      STOCKSHARP_LIVE_TESTS: "true"
      BINANCE_TESTNET_API_KEY: ${{ secrets.BINANCE_TESTNET_API_KEY }}
      BINANCE_TESTNET_API_SECRET: ${{ secrets.BINANCE_TESTNET_API_SECRET }}
    steps:
      - name: Checkout connectors branch
        uses: actions/checkout@v4
        with:
          path: Connectors
      - name: Checkout StockSharp core branch
        uses: actions/checkout@v4
        with:
          repository: thoonnadi2003/StockSharp
          ref: codex/stocksharp-orderbook-fixes
          path: StockSharp (GitHub)
      - name: Check required secrets
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:BINANCE_TESTNET_API_KEY) -or
              [string]::IsNullOrWhiteSpace($env:BINANCE_TESTNET_API_SECRET)) {
            throw "Configure BINANCE_TESTNET_API_KEY and BINANCE_TESTNET_API_SECRET as repository Actions secrets."
          }
      - name: Run Binance trading cycle
        working-directory: Connectors
        run: dotnet test Binance.Tests/Binance.Tests.csproj --configuration Release --filter "FullyQualifiedName~BinanceTradingCycleTests.MarketDataAndTradingCycle"
